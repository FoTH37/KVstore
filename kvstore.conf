port=2000            # 监听端口
workers=6
# 广播发送线程数：必须 = 1！广播出口是单条从库直连 TCP（fd），
# 多线程并发阻塞写同一 socket 在从库积压深时 sock 锁竞争互拖，
# 主库 QPS 从 8 万塌陷到 3.5~4 万（sender=3 实测塌陷，sender=1 稳定 66~81k）。
# 多 sender 并行只有在“每 sender 独立从库连接”架构下才有意义（未实现）。
# key 哈希分片入队代码保留（broadcast 按 key 分流），sender=1 时退化为单队列。
sync_senders=1
# 日志级别：debug=全部（含每条命令）/ info=进度信息 / warn=仅警告与错误 / error=仅错误
# 想得到干净终端设 warn（进度类打印如 worker 启动、连接成功、同步流程全部隐藏）
loglevel=warn
# 持久化模式（rdb / aof / both）
persist_mode=both

# RDMA 全量同步配置
rdma_slave_ip=192.168.1.44
rdma_slave_port=2003

# eBPF 增量同步配置
ebpf_slave_ip=192.168.1.44
ebpf_slave_port=2000
# eBPF 转发通道数（ebpf_proxy 用；命令行第 4 参会覆盖此值）
# 单通道时全链路瓶颈在从库：一条 TCP 只能由一个协程顺序解析执行（约 5 万 cmd/s），
# 而主库广播可达 6~7 万/s → 持续积压。多通道按 hash(key)%N 把命令分到 N 条 TCP，
# 从库侧 N 条连接各一个协程并行执行，同 key 恒定同通道保证保序（跨 key 顺序不保证）。
# 建议值 = 从库 CPU 核数（本项目从库 4 核 → 4，同时把从库 slave_workers 调到 4）；
# 1 = 单通道（原行为，便于对比）。上限 8。运行中不可变更。
ebpf_channels=1
